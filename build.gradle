plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}"

base {
    archivesName = 'afterlight-signal'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = "https://maven.architectury.dev" }
}

neoForge {
    version = project.neo_version
    mods {
        afterlight {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
    runs {
        client {
            client()
        }
        gameTestServer {
            type = "gameTestServer"
        }
    }
    unitTest { enable(); testedMod = mods.afterlight }
}

dependencies {
    implementation("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive false }
    implementation("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive false }
    implementation("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive false }
    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive false }
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

afterEvaluate {
    tasks.named('test') {
        workingDir = projectDir
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
