import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.util.zip.ZipFile
import org.gradle.api.artifacts.dsl.LockMode

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group_id
version = "${mod_version}+${minecraft_version}"

base {
    archivesName = 'afterlight-signal'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.ftb.dev/releases" }
    maven { url = "https://maven.architectury.dev" }
}

neoForge {
    version = project.neo_version
    mods {
        afterlight {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }
    runs {
        client {
            client()
        }
        gameTestServer {
            if (providers.gradleProperty('afterlightDedicatedAcceptance').orNull == 'true') {
                server()
                gameDirectory = layout.buildDirectory.dir('dedicated-acceptance')
                systemProperty 'afterlight.dedicated.acceptance', 'true'
                programArgument '--nogui'
            } else {
                type = "gameTestServer"
            }
        }
    }
    unitTest { enable(); testedMod = mods.afterlight }
}

dependencies {
    implementation("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive false }
    implementation("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive false }
    implementation("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive false }
    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}") { transitive false }
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def lockContext = providers.gradleProperty('afterlightLockContext').orNull
def supportedLockContexts = ['linux', 'macos'] as Set
if (lockContext == null) {
    throw new GradleException('Missing required Gradle property: afterlightLockContext')
}
if (!supportedLockContexts.contains(lockContext)) {
    throw new GradleException(
            "Unsupported afterlightLockContext: ${lockContext}. Expected linux or macos")
}

dependencyLocking {
    lockMode = LockMode.STRICT
    lockFile = file("gradle/dependency-locks/${lockContext}.lockfile")
    lockAllConfigurations()
}

def releasePolicy = file('tools/ReleaseSourcePolicy.java')
def policyJava = file("${System.getProperty('java.home')}/bin/java")
def sourceCommit = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }
def releasePolicyOutput = { String command ->
    providers.exec {
        commandLine policyJava.absolutePath,
                releasePolicy.absolutePath,
                command,
                layout.projectDirectory.asFile.absolutePath
    }.standardOutput.asText.map { it.trim() }
}
def sourceTreeSha256 = releasePolicyOutput('digest-working')
def committedSourceTreeSha256 = releasePolicyOutput('digest-head')
def releaseBuild = providers.gradleProperty('afterlightRelease').map { value ->
    if (value != 'true') {
        throw new GradleException('afterlightRelease must be exactly true when supplied')
    }
    true
}.orElse(false)
def releaseStagingDirectory = layout.projectDirectory.dir('.gradle/release-source')
def releaseStageManifest = releaseStagingDirectory.file('.afterlight-release-stage-manifest')
def configuredSourceCommit = sourceCommit.get()
def configuredCommittedSourceTreeSha256 = committedSourceTreeSha256.get()
def provenanceSourceTreeSha256 = releaseBuild.get()
        ? configuredCommittedSourceTreeSha256
        : sourceTreeSha256
def readReleaseStageManifest = {
    def manifest = releaseStageManifest.asFile
    if (!manifest.isFile()) {
        throw new GradleException("Missing authenticated release stage manifest: ${manifest}")
    }
    def lines = manifest.readLines('UTF-8')
    if (lines.size() != 3
            || lines[0] != 'AFTERLIGHT_RELEASE_STAGE_V1'
            || !lines[1].startsWith('sourceCommit=')
            || !lines[2].startsWith('sourceTreeSha256=')) {
        throw new GradleException('Invalid authenticated release stage manifest')
    }
    def identity = [
            sourceCommit: lines[1].substring('sourceCommit='.length()),
            sourceTreeSha256: lines[2].substring('sourceTreeSha256='.length())
    ]
    if (!(identity.sourceCommit ==~ /[0-9a-f]{40,64}/)
            || !(identity.sourceTreeSha256 ==~ /[0-9a-f]{64}/)) {
        throw new GradleException('Invalid authenticated release stage identity')
    }
    return identity.asImmutable()
}

def stageReleaseSource = tasks.register('stageReleaseSource', Exec) {
    commandLine policyJava.absolutePath,
            releasePolicy.absolutePath,
            'stage-release',
            layout.projectDirectory.asFile.absolutePath,
            releaseStagingDirectory.asFile.absolutePath,
            configuredSourceCommit,
            configuredCommittedSourceTreeSha256
    mustRunAfter tasks.named('clean')
}

def verifyWorkingSourceTypes = tasks.register('verifyWorkingSourceTypes', Exec) {
    commandLine policyJava.absolutePath,
            releasePolicy.absolutePath,
            'verify-working-types',
            layout.projectDirectory.asFile.absolutePath
}

if (releaseBuild.get()) {
    sourceSets.main.java.setSrcDirs([
            releaseStagingDirectory.dir('src/main/java').asFile
    ])
    sourceSets.main.resources.setSrcDirs([
            releaseStagingDirectory.dir('src/main/resources').asFile
    ])
    sourceSets.test.java.setSrcDirs([
            releaseStagingDirectory.dir('src/test/java').asFile
    ])
    sourceSets.test.resources.setSrcDirs([
            releaseStagingDirectory.dir('src/test/resources').asFile
    ])
}

def sourceInputGate = releaseBuild.get() ? stageReleaseSource : verifyWorkingSourceTypes
for (String taskName : [
        'compileJava',
        'processResources',
        'compileTestJava',
        'processTestResources']) {
    tasks.named(taskName) {
        dependsOn sourceInputGate
    }
}

tasks.withType(ProcessResources).configureEach {
    filePermissions {
        unix('0644')
    }
    dirPermissions {
        unix('0755')
    }
}

def provenanceFile = layout.buildDirectory.file(
        'resources/main/META-INF/afterlight-provenance.json')

tasks.named('processResources') {
    inputs.property 'afterlightSourceCommit', configuredSourceCommit
    inputs.property 'afterlightSourceTreeSha256', provenanceSourceTreeSha256
    inputs.property 'afterlightReleaseBuild', releaseBuild
    if (releaseBuild.get()) {
        inputs.file releaseStageManifest
    }
    outputs.file provenanceFile
    doLast {
        def identity = releaseBuild.get()
                ? readReleaseStageManifest()
                : [
                        sourceCommit: configuredSourceCommit,
                        sourceTreeSha256: provenanceSourceTreeSha256.get()
                ]
        def output = provenanceFile.get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schema: 3,
                sourceTreeDigestSchema: 2,
                sourceRepository: 'https://github.com/Luskish/afterlight-signal',
                sourceCommit: identity.sourceCommit,
                sourceTreeSha256: identity.sourceTreeSha256,
                releaseBuild: releaseBuild.get(),
                version: project.version.toString()
        ])) + '\n'
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('runGameTestServer') {
    if (providers.gradleProperty('afterlightDedicatedAcceptance').orNull == 'true') {
        doFirst {
            def directory = layout.buildDirectory.dir('dedicated-acceptance').get().asFile
            directory.mkdirs()
            new File(directory, 'eula.txt').text = 'eula=true\n'
            new File(directory, 'server.properties').text = '''\
online-mode=false
server-port=0
spawn-protection=0
'''
        }
    }
}

def configureManifest = { Jar archive ->
    archive.manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': project.version.toString())
    }
}

tasks.named('jar', Jar) {
    dependsOn sourceInputGate
    configureManifest(delegate)
}

def rebuiltReleaseJar = tasks.register('reproducibleReleaseJar', Jar) {
    dependsOn sourceInputGate
    from sourceSets.main.output
    archiveBaseName = 'afterlight-signal'
    archiveVersion = project.version.toString()
    destinationDirectory = layout.buildDirectory.dir('reproducible-libs')
    configureManifest(delegate)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }

def transitivelyDependsOn = { Task task, Task required ->
    def pending = new ArrayDeque<Task>()
    def visited = new LinkedHashSet<Task>()
    pending.add(task)
    while (!pending.isEmpty()) {
        Task current = pending.removeFirst()
        if (!visited.add(current)) {
            continue
        }
        for (Task dependency : current.taskDependencies.getDependencies(current)) {
            if (dependency == required) {
                return true
            }
            pending.addLast(dependency)
        }
    }
    return false
}

afterEvaluate {
    tasks.named('test') {
        workingDir = projectDir
        dependsOn tasks.named('jar')
        dependsOn rebuiltReleaseJar
        systemProperty 'afterlight.source.root', layout.projectDirectory.asFile.absolutePath
        systemProperty 'afterlight.lock.context', lockContext
        systemProperty 'afterlight.source.commit', configuredSourceCommit
        systemProperty 'afterlight.source.tree.sha256', releaseBuild.get()
                ? configuredCommittedSourceTreeSha256
                : provenanceSourceTreeSha256.get()
        systemProperty 'afterlight.committed.source.tree.sha256',
                configuredCommittedSourceTreeSha256
        systemProperty 'afterlight.release.build', releaseBuild.get()
        systemProperty 'afterlight.release.jar', releaseJar.get().asFile.absolutePath
        systemProperty 'afterlight.rebuilt.release.jar',
                rebuiltReleaseJar.get().archiveFile.get().asFile.absolutePath
        systemProperty 'afterlight.release.staging.root',
                releaseStagingDirectory.asFile.absolutePath
        systemProperty 'afterlight.release.stage.manifest',
                releaseStageManifest.asFile.absolutePath
        systemProperty 'afterlight.release.main.java.roots',
                sourceSets.main.java.srcDirs*.absolutePath.join(File.pathSeparator)
        systemProperty 'afterlight.release.main.resources.roots',
                sourceSets.main.resources.srcDirs*.absolutePath.join(File.pathSeparator)
        systemProperty 'afterlight.release.test.java.roots',
                sourceSets.test.java.srcDirs*.absolutePath.join(File.pathSeparator)
        systemProperty 'afterlight.release.test.resources.roots',
                sourceSets.test.resources.srcDirs*.absolutePath.join(File.pathSeparator)
        for (String taskName : [
                'compileJava',
                'processResources',
                'compileTestJava',
                'processTestResources']) {
            systemProperty "afterlight.release.stage.precedes.${taskName}",
                    transitivelyDependsOn(tasks.named(taskName).get(), stageReleaseSource.get())
        }
    }
}

def verifyReleaseSourceAfterBuild = tasks.register('verifyReleaseSourceAfterBuild', Exec) {
    dependsOn tasks.named('jar')
    commandLine policyJava.absolutePath,
            releasePolicy.absolutePath,
            'verify-staged-release',
            layout.projectDirectory.asFile.absolutePath,
            releaseStagingDirectory.asFile.absolutePath,
            configuredSourceCommit,
            configuredCommittedSourceTreeSha256
    mustRunAfter tasks.named('jar')
}

def verifyTrackedJars = tasks.register('verifyTrackedJars') {
    doLast {
        def tracked = providers.exec {
            commandLine 'git', 'ls-files', '--', '*.jar'
        }.standardOutput.asText.get().trim()
        if (!tracked.isEmpty()) {
            throw new GradleException("Tracked JARs are forbidden: ${tracked}")
        }
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('test')
    dependsOn rebuiltReleaseJar
    dependsOn verifyReleaseSourceAfterBuild
    dependsOn verifyTrackedJars
    inputs.file releaseJar
    inputs.file rebuiltReleaseJar.flatMap { it.archiveFile }
    inputs.file releaseStageManifest
    doLast {
        if (!releaseBuild.get()) {
            throw new GradleException('verifyReleaseJar requires -PafterlightRelease=true')
        }
        def primary = releaseJar.get().asFile
        def rebuilt = rebuiltReleaseJar.get().archiveFile.get().asFile
        def stageIdentity = readReleaseStageManifest()
        if (stageIdentity.sourceCommit != configuredSourceCommit
                || stageIdentity.sourceTreeSha256 != configuredCommittedSourceTreeSha256) {
            throw new GradleException('Authenticated release stage identity changed')
        }
        providers.exec {
            commandLine policyJava.absolutePath,
                    releasePolicy.absolutePath,
                    'verify-staged-release',
                    layout.projectDirectory.asFile.absolutePath,
                    releaseStagingDirectory.asFile.absolutePath,
                    configuredSourceCommit,
                    configuredCommittedSourceTreeSha256
        }.standardOutput.asText.get()
        if (Files.mismatch(primary.toPath(), rebuilt.toPath()) != -1L) {
            throw new GradleException('Independent release JAR reconstruction changed bytes')
        }
        new ZipFile(primary).withCloseable { zip ->
            def provenanceEntry = zip.getEntry('META-INF/afterlight-provenance.json')
            if (provenanceEntry == null) {
                throw new GradleException('Release JAR lacks source provenance')
            }
            def provenance = new JsonSlurper().parse(zip.getInputStream(provenanceEntry))
            if (provenance.keySet() != [
                    'schema',
                    'sourceTreeDigestSchema',
                    'sourceRepository',
                    'sourceCommit',
                    'sourceTreeSha256',
                    'releaseBuild',
                    'version'] as Set
                    || provenance.schema != 3
                    || provenance.sourceTreeDigestSchema != 2
                    || provenance.sourceRepository != 'https://github.com/Luskish/afterlight-signal'
                    || provenance.sourceCommit != stageIdentity.sourceCommit
                    || provenance.sourceTreeSha256 != stageIdentity.sourceTreeSha256
                    || provenance.releaseBuild != true
                    || provenance.version != project.version.toString()) {
                throw new GradleException('Release JAR provenance changed from committed source')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
