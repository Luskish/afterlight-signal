name: bootstrap-linux-lock

on:
  push:
    branches:
      - codex/linux-lock-bootstrap

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          architecture: x64
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.2.1'
      - name: Generate strict Linux lock state
        run: |
          mkdir -p gradle/dependency-locks
          gradle dependencies --write-locks --no-daemon > /tmp/afterlight-linux-lock.log
          test -s gradle/dependency-locks/linux.lockfile
          echo AFTERLIGHT_LINUX_LOCK_BEGIN
          base64 -w 0 gradle/dependency-locks/linux.lockfile
          echo
          echo AFTERLIGHT_LINUX_LOCK_END
