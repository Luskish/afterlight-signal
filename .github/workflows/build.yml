name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source A
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source-a
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout source B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source-b
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          architecture: x64
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.2.1'
      - name: Build source A
        working-directory: source-a
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-a
        run: gradle clean test runGameTestServer build verifyReleaseJar -PafterlightRelease=true -PafterlightLockContext=linux --no-daemon --no-build-cache --rerun-tasks
      - name: Build source B
        working-directory: source-b
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-b
        run: gradle clean test runGameTestServer build verifyReleaseJar -PafterlightRelease=true -PafterlightLockContext=linux --no-daemon --no-build-cache --rerun-tasks
      - name: Compare and audit independent builds
        run: |
          first=source-a/build/libs/afterlight-signal-0.1.0+1.21.1.jar
          second=source-b/build/libs/afterlight-signal-0.1.0+1.21.1.jar
          shasum -a 256 "$first"
          shasum -a 256 "$second"
          cmp --silent "$first" "$second"
          test "$(shasum -a 256 "$first" | cut -d ' ' -f 1)" = "$(shasum -a 256 "$second" | cut -d ' ' -f 1)"
          java source-a/tools/ReleaseSourcePolicy.java verify-release source-a
          java source-b/tools/ReleaseSourcePolicy.java verify-release source-b
          test -z "$(git -C source-a ls-files '*.jar')"
          test -z "$(git -C source-b ls-files '*.jar')"
          test -z "$(git -C source-a status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C source-b status --porcelain=v1 --untracked-files=all)"
          test -z "$(jps -lv | grep -E 'GradleDaemon|GradleWorkerMain' || true)"
