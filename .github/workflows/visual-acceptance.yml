name: visual acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'tools/run-visual-acceptance-linux.sh'
      - 'tools/visual-acceptance-lib.sh'
      - '.github/workflows/visual-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: visual-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          architecture: x64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '9.2.1'
      - name: Install pinned Xvfb and Mesa snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /etc/apt/sources.list.d/ubuntu.sources
          test -f /etc/apt/apt-mirrors.txt
          grep -Eq '^URIs:[[:space:]]+mirror\+file:/etc/apt/apt-mirrors\.txt$' /etc/apt/sources.list.d/ubuntu.sources
          sudo install -d -m 0755 /etc/apt/disabled-sources
          sudo mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/disabled-sources/ubuntu.sources
          sudo mv /etc/apt/apt-mirrors.txt /etc/apt/disabled-sources/apt-mirrors.txt
          if [[ -f /etc/apt/sources.list ]]; then
            sudo mv /etc/apt/sources.list /etc/apt/disabled-sources/sources.list
          fi
          sudo tee /etc/apt/sources.list.d/ubuntu-snapshot.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://snapshot.ubuntu.com/ubuntu/20250115T000000Z/
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          if sudo grep -RHE \
            --include='*.list' \
            --include='*.sources' \
            'mirror\+file:|https?://([^/]+\.)?(archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?' \
            /etc/apt/sources.list.d; then
            printf '%s\n' 'Active live Ubuntu mirror remained after snapshot setup' >&2
            exit 1
          fi
          sudo apt-get -o Acquire::Check-Valid-Until=false update
          pinned_packages=(
            xvfb=2:21.1.12-1ubuntu1.1
            xauth=1:1.1.2-1build1
            libgl1-mesa-dri=24.0.9-0ubuntu0.3
            libglx-mesa0=24.0.9-0ubuntu0.3
            libglapi-mesa=24.0.9-0ubuntu0.3
            libegl-mesa0=24.0.9-0ubuntu0.3
            libgbm1=24.0.9-0ubuntu0.3
            mesa-utils=9.0.0-2
          )
          sudo apt-get -o Acquire::Check-Valid-Until=false install \
            --allow-downgrades \
            --no-install-recommends \
            -y \
            "${pinned_packages[@]}"
          for package_pin in "${pinned_packages[@]}"; do
            package_name="${package_pin%%=*}"
            expected_version="${package_pin#*=}"
            installed_version="$(dpkg-query -W -f='${Version}' "$package_name")"
            if [[ "$installed_version" != "$expected_version" ]]; then
              printf 'Pinned package version mismatch: %s expected=%s actual=%s\n' \
                "$package_name" "$expected_version" "$installed_version" >&2
              exit 1
            fi
          done
      - name: Render acceptance artifacts
        run: ./tools/run-visual-acceptance-linux.sh
      - name: Upload rendered PNG inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afterlight-visual-acceptance-${{ github.sha }}
          path: build/visual-artifacts
          if-no-files-found: error
          retention-days: 14
