name: visual acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          architecture: x64
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.2.1'
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Render acceptance artifacts
        run: ./tools/run-visual-acceptance-linux.sh
      - name: Upload rendered PNG inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afterlight-visual-acceptance-${{ github.sha }}
          path: build/visual-artifacts
          if-no-files-found: error
          retention-days: 14
